<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Café · Venta</title>
<link rel="stylesheet" href="../assets/css/cafe.css">
<style>
body{display:flex;overflow:hidden}
nav{width:164px;flex:none;background:var(--prof);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:2px}
.wm{padding:0 0 16px;display:flex;justify-content:center}.wm img{width:104px;height:104px;border-radius:50%;display:block;box-shadow:0 0 0 3px rgba(255,255,255,.22),0 6px 16px rgba(0,0,0,.25)}
nav a{padding:12px 10px;border-radius:12px;color:rgba(255,255,255,.78);text-decoration:none;font-size:12px;letter-spacing:.14em;
  text-transform:uppercase;transition:background-color 150ms ease,transform 160ms var(--ease)}
nav a.on{background:rgba(255,255,255,.16);color:#fff}
nav a:active{transform:scale(.97)}
nav a.soon{opacity:.5;pointer-events:none}
@media (hover:hover) and (pointer:fine){nav a:not(.on):not(.soon):hover{background:rgba(255,255,255,.08)}}
main{flex:1;display:flex;flex-direction:column;min-width:0;padding:22px 26px;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end}
header .in{width:300px}
.pos{flex:1;min-height:0;display:flex;gap:22px}
.cat{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px}
#chips{display:flex;flex:none;flex-wrap:wrap;gap:8px}
.chip{padding:8px 18px;border-radius:999px;border:1.5px solid var(--prof);color:var(--prof);font-weight:600;white-space:nowrap;
  transition:background-color 150ms ease,color 150ms ease,transform 160ms var(--ease)}
.chip.on{background:var(--prof);color:#fff}
.chip:active{transform:scale(.97)}
#grid{display:grid;flex:1;min-height:0;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:max-content;gap:14px;overflow-y:auto;align-content:start;padding-right:8px}
.p{border:1px solid var(--linea);border-radius:14px;overflow:hidden;text-align:left;transition:transform 160ms var(--ease)}
.p:active{transform:scale(.97)}
/* Aquí irá la foto real: <img data-src="..."> con carga diferida */
.ph{height:88px;background:var(--niebla);display:grid;place-items:center;color:var(--prof)}
.ph svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pm{padding:10px 12px 12px}.pm b{display:block;font-weight:600}.pm span{color:var(--prof)}
aside{width:340px;flex:none;border:1px solid var(--linea);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
aside input{text-align:center;font-weight:600}
#items{flex:1;overflow-y:auto}
.it{display:grid;grid-template-columns:1fr auto 78px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--linea)}
.it small{color:var(--suave)}.it .mono{text-align:right}
.q{display:flex;align-items:center;gap:8px}
.q button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--prof);color:var(--prof);font-weight:700;transition:transform 160ms var(--ease)}
.q button:active{transform:scale(.92)}
.empty{color:var(--suave);text-align:center;margin-top:40px}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot strong{font-size:30px;font-weight:400}
[hidden]{display:none!important}
.pend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pend:empty{display:none}
.pe{padding:7px 14px;border-radius:999px;background:var(--niebla);color:var(--prof);font-weight:600;transition:background-color 150ms ease,transform 160ms var(--ease)}
.pe small{margin-left:8px;color:var(--tinta)}
.pe.on{background:var(--prof);color:#fff}.pe.on small{color:#fff}
.pe:active{transform:scale(.97)}
.lnk{color:var(--suave);font-size:13px;text-decoration:underline;padding:4px}
.mo{position:fixed;inset:0;background:rgba(16,34,47,.45);display:grid;place-items:center;z-index:50;animation:fade 150ms ease}
.mb{background:var(--crema);border-radius:14px;padding:26px;width:min(440px,92vw);display:flex;flex-direction:column;gap:14px;animation:pop 200ms var(--ease)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
.met{display:flex;gap:8px}.met .chip{flex:1}
.rap{display:flex;gap:8px;flex-wrap:wrap}.rap .chip{padding:6px 14px}
.in.m{text-align:center;font-family:var(--m);font-size:22px}
.cam{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px solid var(--linea)}
.cam b{font-size:28px;font-weight:400}
.acc{display:flex;gap:10px}.acc .pill{flex:1}
.ok{text-align:center;align-items:center}
.caiaviso{padding:10px 16px;border-radius:12px;background:#F6E8C8;color:#6b5314;font-weight:600}
.caiaviso.bad{background:#F6D5CC;color:#8A2E15}
.cf{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--linea)}
.fs{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--linea)}
.er{color:#8A2E15;font-size:12px;min-height:14px}
.mb.tkmb{width:min(430px,94vw);max-height:94vh;overflow-y:auto}
.tkbox{width:100%;flex:none;display:flex;justify-content:center;overflow-x:auto}
.mb.ok .acc{width:100%}.mb.ok .fs{width:100%;text-align:left}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:var(--tinta);color:#fff;padding:12px 22px;border-radius:999px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity 200ms ease,transform 200ms var(--ease);z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<main>
  <header>
    <div><p class="eyebrow">Turno abierto · Caja 1</p><h1 class="h">Punto de venta</h1></div>
    <input class="in" id="q" placeholder="Buscar producto…" aria-label="Buscar producto" autocomplete="off">
  </header>
  <div class="caiaviso" id="caiAviso" hidden></div>
  <div class="pend" id="pend"></div>
  <div class="pos">
    <section class="cat"><div id="chips"></div><div id="grid"></div></section>
    <aside>
      <p class="eyebrow">Comanda</p>
      <input class="in" id="nom" maxlength="40" placeholder="Nombre: Mesa 5, Para llevar…" aria-label="Nombre de la comanda">
      <div id="items"></div>
      <div class="tot"><span class="eyebrow">Total</span><strong class="mono" id="tot">L 0.00</strong></div>
      <button class="pill" id="hold">Guardar pendiente</button>
      <button class="pill fill" id="pay">Cobrar</button>
      <button class="lnk" id="cancel" hidden>Cancelar comanda</button>
    </aside>
  </div>
</main>

<div id="mo" class="mo" hidden></div>
<div id="toast" role="alert"></div>

<script src="../assets/js/factura_ticket.js"></script>
<script>
const ICONOS=['taza','frappe','smoothie','soda','waffle','cocina','nevada','extra'];
// Datos de ejemplo: solo se usan al abrir el archivo en el navegador (sin Java).
const DEMO={categorias:[{id:1,nombre:'Café caliente',icono:'taza'},{id:2,nombre:'Frappés',icono:'frappe'},{id:3,nombre:'Sodas',icono:'soda'},{id:4,nombre:'Waffles',icono:'waffle'}],
 productos:[{id:1,c:1,n:'Americano 12 oz',p:5500},{id:2,c:1,n:'Latte 12 oz',p:6500},{id:3,c:2,n:'Frappé Maní',p:11000},{id:4,c:2,n:'Frappé Oreo',p:11000},{id:5,c:3,n:'Soda Italiana',p:8000},{id:6,c:4,n:'Buttermilk Waffle',p:10000}]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();   // busca sin importar tildes ni mayúsculas
const money=c=>'L '+(c/100).toLocaleString('en-US',{minimumFractionDigits:2});   // el dinero viaja en centavos
let C=[],P=[],cat=0,cart={},q='';   // cart: idProducto -> cantidad
const prod=id=>P.find(p=>p.id===id);
const icono=idc=>{const c=C.find(x=>x.id===idc);return c&&ICONOS.includes(c.icono)?c.icono:'taza'};
function cargar(d){C=d.categorias;P=d.productos;if(cat&&!C.some(c=>c.id===cat))cat=0;chips();grid();ticket()}
// Java llama a onJavaReady cuando el puente está listo: sin caja abierta se va a abrir caja, con caja carga el menú real
window.onJavaReady=()=>{
  if(!javaApp.hayTurnoAbierto()){javaApp.irA('caja.html');return}
  cargar(JSON.parse(javaApp.catalogo()));
  pendientes();
  avisoCai();
};
window.addEventListener('load',()=>setTimeout(()=>{if(!window.javaApp){cargar(DEMO);pendientes();avisoCai()}},400));
function chips(){$('#chips').innerHTML=[{id:0,nombre:'Todos'},...C].map(c=>`<button class="chip${c.id===cat?' on':''}" data-c="${c.id}">${esc(c.nombre)}</button>`).join('')}
function grid(){
 const f=q?P.filter(p=>norm(p.n).includes(q)):P.filter(p=>!cat||p.c===cat);   // al buscar, mira todas las categorías
 $('#grid').innerHTML=!f.length?'<p class="empty" style="grid-column:1/-1">Sin resultados</p>':f.map(p=>
 `<button class="p" data-id="${p.id}"><div class="ph"><svg><use href="#i-${icono(p.c)}" xlink:href="#i-${icono(p.c)}"/></svg></div><div class="pm"><b>${esc(p.n)}</b><span class="mono">${money(p.p)}</span></div></button>`).join('')}
function ticket(){
  const r=Object.entries(cart).map(([id,q])=>[prod(+id),q]).filter(([p])=>p);
  $('#items').innerHTML=r.length?r.map(([p,q])=>`<div class="it"><div><b>${esc(p.n)}</b><br><small class="mono">${money(p.p)}</small></div>
   <div class="q"><button data-m="-" data-id="${p.id}" aria-label="Quitar uno">−</button><span class="mono">${q}</span><button data-m="+" data-id="${p.id}" aria-label="Agregar uno">+</button></div>
   <span class="mono">${money(p.p*q)}</span></div>`).join(''):'<p class="empty">Toca un producto para agregarlo</p>';
  const t=r.reduce((s,[p,q])=>s+p.p*q,0);$('#tot').textContent=money(t);$('#pay').disabled=$('#hold').disabled=!t;
}
// ---------- Comandas pendientes y cobro ----------
let idVenta=0,metodo='Efectivo',recC=0,sinConfirmar=false;
const V=()=>window.javaVenta||DEMO_V;   // sin Java (en el navegador) usa datos de ejemplo en memoria
const lineas=()=>Object.entries(cart).map(([id,n])=>id+':'+n).join(',');   // formato que entiende Java: "12:2,35:1"
const nombre=()=>$('#nom').value.trim();
const total=()=>Object.entries(cart).reduce((s,[id,n])=>s+(prod(+id)?prod(+id).p*n:0),0);
let tT;function aviso(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),4000)}
window.mostrarError=aviso;   // Java llama a esta función cuando algo falla
function limpiar(){cart={};idVenta=0;sinConfirmar=false;$('#nom').value='';$('#cancel').hidden=true;ticket();pendientes()}
function pendientes(){
  const l=JSON.parse(V().pendientes());
  $('#pend').innerHTML=l.length?'<span class="eyebrow">Pendientes</span>'+l.map(p=>`<button class="pe${p.id===idVenta?' on':''}" data-id="${p.id}">${esc(p.n)}<small class="mono">${money(p.t)}</small></button>`).join(''):'';
}
function abrirPend(id){
  if(Object.keys(cart).length&&+id!==idVenta){aviso('Guarda o cobra la comanda actual antes de abrir otra');return}
  const c=JSON.parse(V().abrirPendiente(String(id)));
  if(!c.id){aviso('Esa comanda ya no está pendiente');pendientes();return}
  cart={};let fuera=0;
  c.lineas.forEach(l=>{if(prod(l.id))cart[l.id]=l.q;else fuera++});
  idVenta=c.id;$('#nom').value=c.nombre;$('#cancel').hidden=false;ticket();pendientes();
  if(fuera)aviso('Un producto ya no está disponible y se quitó de la comanda');
}
function guardarPend(){
  const r=JSON.parse(V().guardarPendiente(String(idVenta),nombre(),lineas()));
  if(r.ok){limpiar();aviso('Comanda guardada')}
}
function cancelarPend(){   // pide confirmar con un segundo toque, para no cancelar sin querer
  const b=$('#cancel');
  if(!sinConfirmar){sinConfirmar=true;b.textContent='¿Seguro? Toca otra vez para cancelar';setTimeout(()=>{sinConfirmar=false;b.textContent='Cancelar comanda'},3000);return}
  const r=JSON.parse(V().cancelarPendiente(String(idVenta)));
  b.textContent='Cancelar comanda';
  if(r.ok){limpiar();aviso('Comanda cancelada')}
}
function abrirCobro(){
  if(!total())return;
  metodo='Efectivo';recC=0;cliOn=false;cliNom='';cliRtn='';pintarCobro();$('#mo').hidden=false;
}
function pintarCobro(){
  const t=total(),ef=metodo==='Efectivo';
  $('#mo').innerHTML=`<div class="mb" role="dialog" aria-modal="true" aria-label="Cobrar">
   <p class="eyebrow">Cobrar${nombre()?' · '+esc(nombre()):''}</p>
   <div class="tot"><span class="eyebrow">Total</span><strong class="mono">${money(t)}</strong></div>
   <div class="met">${['Efectivo','Tarjeta','Transferencia'].map(x=>`<button class="chip${x===metodo?' on':''}" data-met="${x}">${x}</button>`).join('')}</div>
   ${ef?`<input class="in m" id="rec" data-fmt="dec2" inputmode="decimal" autocomplete="off" placeholder="Recibido L 0.00" value="${recC?recC/100:''}">
   <div class="rap"><button class="chip" data-rap="${t}">Exacto</button><button class="chip" data-rap="10000">L 100</button><button class="chip" data-rap="50000">L 500</button></div>
   <div class="cam"><span class="eyebrow">Cambio</span><b class="mono" id="cam"></b></div>`:'<p class="empty" style="margin:6px 0">Se cobra el total exacto.</p>'}
   ${cliOn?`<div class="fs"><p class="eyebrow">Factura con datos del cliente</p>
     <input class="in" id="cli-n" maxlength="60" autocomplete="off" placeholder="Nombre del cliente" value="${esc(cliNom)}">
     <input class="in m" id="cli-r" data-fmt="rtn" inputmode="numeric" maxlength="17" autocomplete="off" placeholder="RTN (14 dígitos, opcional)" value="${esc(cliRtn)}">
     <p class="er" id="cli-e"></p><button class="lnk" data-cli="0">Quitar y dejar como Consumidor final</button></div>`
   :`<div class="cf"><span>Factura a <b>Consumidor final</b></span><button class="lnk" data-cli="1">¿Pide factura con RTN?</button></div>`}
   <div class="acc"><button class="pill" data-volver="1">Volver</button><button class="pill fill" id="ok">Confirmar cobro</button></div></div>`;
  refrescar();
  if(ef)$('#rec').focus();
}
function refrescar(){   // actualiza cambio y botón sin volver a dibujar (así no se pierde el cursor al escribir)
  const t=total(),ef=metodo==='Efectivo';
  if(ef)$('#cam').textContent=recC>=t?money(recC-t):'—';
  $('#ok').disabled=(ef&&recC<t)||!cliOk();
  if(cliOn)$('#cli-e').textContent=cliRtn&&!rtnOk(cliRtn)?'El RTN debe tener 14 dígitos':'';
}
function confirmarCobro(){
  $('#ok').disabled=true;   // evita cobrar dos veces con un doble toque
  // Cobra Y factura en el mismo paso: Java consume el siguiente número del CAI y registra la factura vigente
  const r=JSON.parse(V().cobrar(String(idVenta),nombre(),lineas(),metodo,String(metodo==='Efectivo'?recC:0),cliOn?cliNom.trim():'',cliOn?cliRtn.replace(/[\s-]/g,''):''));
  if(!r.ok){refrescar();return}
  limpiar();
  mostrarComprobante(r);
}
// ---------- Factura emitida al cobrar ----------
let cliOn=false,cliNom='',cliRtn='',facAct=null,reemOn=false,reNom='',reRtn='',cobroAct=null;
const F=()=>window.javaFacturas||DEMO_F;   // sin Java (en el navegador) usa una factura de ejemplo
const rtnOk=v=>/^(\d{14})?$/.test(v.replace(/[\s-]/g,''));
const cliOk=()=>!cliOn||(cliNom.trim()!==''&&rtnOk(cliRtn));
function avisoCai(){   // avisa ANTES de cobrar si el CAI no deja facturar o se está acabando
  let e;try{e=JSON.parse(F().estado())}catch(x){return}
  const b=$('#caiAviso');let m='';
  if(e.problema)m=e.problema+'. No se puede cobrar hasta resolverlo.';
  else if(e.rest<=50||e.dias<=30)m='Atención: quedan '+e.rest+' facturas del CAI y vence en '+e.dias+' días.';
  b.textContent=m;b.hidden=!m;b.className='caiaviso'+(e.problema?' bad':'');
}
function mostrarComprobante(r){
  cobroAct=r;reemOn=false;reNom='';reRtn='';
  facAct=JSON.parse(F().ver(String(r.factura)));
  pintarComprobante();
  if(facAct.neg&&facAct.neg.auto)imprimirFac();   // si está activada la impresión automática
}
function pintarComprobante(){
  const r=cobroAct,f=facAct,ef=f.pago==='Efectivo';
  $('#mo').innerHTML=`<div class="mb ok tkmb" role="dialog" aria-modal="true" aria-label="Venta cobrada y facturada">
   <p class="eyebrow">Venta cobrada · factura emitida</p>
   <strong class="mono" style="font-size:34px;font-weight:400">${money(r.total)}</strong>
   ${ef?`<div class="cam" style="width:100%"><span class="eyebrow">Recibido ${money(r.recibido)} · Cambio</span><b class="mono">${money(r.cambio)}</b></div>`:''}
   <div class="tkbox">${FacturaTicket.cuerpo(f)}</div>
   ${reemOn?`<div class="fs"><p class="eyebrow">Factura con datos del cliente</p>
     <input class="in" id="re-n" maxlength="60" autocomplete="off" placeholder="Nombre del cliente" value="${esc(reNom)}">
     <input class="in m" id="re-r" data-fmt="rtn" inputmode="numeric" maxlength="17" autocomplete="off" placeholder="RTN (14 dígitos, opcional)" value="${esc(reRtn)}">
     <p class="er" id="re-e"></p>
     <p class="nota" style="font-size:12px;color:var(--suave)">Se anula esta factura y se emite otra con estos datos (consume un número nuevo del CAI).</p>
     <div class="acc"><button class="pill" id="reno">Volver</button><button class="pill fill" id="reok" disabled>Emitir con estos datos</button></div></div>`
   :`<div class="acc"><button class="pill" id="imp">Imprimir</button><button class="pill" id="otro">Cliente pide RTN</button></div>`}
   <button class="pill fill" id="nueva">Nueva venta</button></div>`;
  if(reemOn)$('#re-n').focus();else $('#nueva').focus({preventScroll:true});
}
function imprimirFac(){
  if(!facAct)return;
  if(!window.javaFacturas){aviso('Vista de prueba: aquí se mandaría a la impresora');return}
  const r=JSON.parse(F().imprimir(FacturaTicket.documento(facAct)));
  if(r.ok)aviso('Enviado a la impresora');
}
function reemitirFac(){   // el cliente pidió RTN o datos "en el último segundo": anula la factura y emite otra
  const rtn=reRtn.replace(/[\s-]/g,'');
  const r=JSON.parse(F().reemitir(String(facAct.id),reNom.trim(),rtn));
  if(!r.ok)return;
  facAct=JSON.parse(F().ver(String(r.id)));reemOn=false;pintarComprobante();
  aviso('Factura anterior anulada · nueva factura '+facAct.num);
  if(facAct.neg&&facAct.neg.auto)imprimirFac();
}
function cerrarCobro(){$('#mo').hidden=true;$('#mo').innerHTML=''}
document.addEventListener('input',e=>{
  if(e.target.id==='cli-n'){cliNom=e.target.value;refrescar();return}
  if(e.target.id==='cli-r'){cliRtn=e.target.value;refrescar();return}
  if(e.target.id==='re-n'||e.target.id==='re-r'){
    if(e.target.id==='re-n')reNom=e.target.value;else reRtn=e.target.value;
    $('#reok').disabled=!(reNom.trim()&&rtnOk(reRtn));$('#re-e').textContent=reRtn&&!rtnOk(reRtn)?'El RTN debe tener 14 dígitos':'';return}
  if(e.target.id!=='rec')return;
  const v=parseFloat(e.target.value.replace(',','.'));recC=isNaN(v)||v<0?0:Math.round(v*100);refrescar();
});
document.addEventListener('keydown',e=>{
  if($('#mo').hidden)return;
  if(e.key==='Escape')cerrarCobro();
  else if(e.key==='Enter'){if(e.target.tagName==='BUTTON'&&$('#nueva'))return;const b=$('#ok')||$('#reok')||$('#nueva');if(b&&!b.disabled){e.preventDefault();b.click()}}
});
// Datos de ejemplo en memoria: solo para ver el diseño en el navegador (sin Java)
const mem={id:0,pend:[]};
const parseL=s=>s.split(',').filter(Boolean).map(x=>x.split(':').map(Number));
const totL=l=>l.reduce((s,[id,n])=>s+(prod(id)?prod(id).p*n:0),0);
const DEMO_V={
 pendientes:()=>JSON.stringify(mem.pend.map(p=>({id:p.id,n:p.nombre,t:totL(p.l),h:''}))),
 abrirPendiente:id=>{const p=mem.pend.find(x=>x.id==id);return JSON.stringify(p?{id:p.id,nombre:p.nombre,lineas:p.l.map(([i,n])=>({id:i,q:n}))}:{})},
 guardarPendiente:(id,nom,l)=>{const p=mem.pend.find(x=>x.id==id);if(p){p.nombre=nom||'Sin nombre';p.l=parseL(l)}else mem.pend.push({id:++mem.id,nombre:nom||'Sin nombre',l:parseL(l)});return JSON.stringify({ok:true,id:p?p.id:mem.id})},
 cobrar:(id,nom,l,met,rec,cn,cr)=>{const t=totL(parseL(l));if(met==='Efectivo'&&+rec<t){aviso('El monto recibido no alcanza');return '{"ok":false}'}
   mem.pend=mem.pend.filter(x=>x.id!=id);const r=met==='Efectivo'?+rec:t;demoFactura(l,t,met,r,cn,cr);return JSON.stringify({ok:true,id:0,total:t,recibido:r,cambio:r-t,factura:demoFac.id,numero:demoFac.num})},
 cancelarPendiente:id=>{mem.pend=mem.pend.filter(x=>x.id!=id);return '{"ok":true}'}
};
let demoFac=null,demoN=0;
function demoFactura(l,t,met,rec,cn,cr){
  const L=parseL(l).filter(([id])=>prod(id)).map(([id,n])=>({n:prod(id).n,q:n,p:prod(id).p,s:prod(id).p*n}));
  const isv=t-Math.round(t*10000/11500);demoN++;
  demoFac={id:demoN,num:'000-001-01-'+String(demoN).padStart(8,'0'),cai:'CAI-DE-EJEMPLO',desde:'000-001-01-00000001',hasta:'000-001-01-00000500',limite:'2027-12-31',
   rtn:cr||'',cli:cn||'Consumidor final',sub:t-isv,isv,pct:1500,tot:t,user:'Demo',fecha:new Date().toISOString().replace('T',' ').slice(0,19),an:false,pago:met,rec,cam:rec-t,l:L,
   neg:{n:'Café Café',rtn:'00000000000000',dir:'',tel:'',mail:'',auto:false}};
}
const DEMO_F={
 estado:()=>JSON.stringify({problema:'',rest:400,dias:200}),
 ver:()=>JSON.stringify(demoFac),
 reemitir:(id,n,r)=>{const f=demoFac;demoFactura(f.l.map(x=>x.n&&P.find(p=>p.n===x.n)?P.find(p=>p.n===x.n).id+':'+x.q:'').filter(Boolean).join(','),f.tot,f.pago,f.rec,n,r);return JSON.stringify({ok:true,id:demoFac.id})},
 imprimir:()=>'{"ok":true}'
};
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.met){metodo=b.dataset.met;recC=0;pintarCobro()}
  else if(b.dataset.rap!==undefined){recC=+b.dataset.rap;pintarCobro()}
  else if(b.dataset.cli!==undefined){cliOn=b.dataset.cli==='1';pintarCobro();if(cliOn)$('#cli-n').focus()}
  else if(b.id==='imp')imprimirFac()
  else if(b.id==='otro'){reemOn=true;reNom='';reRtn='';pintarComprobante()}
  else if(b.id==='reno'){reemOn=false;pintarComprobante()}
  else if(b.id==='reok')reemitirFac()
  else if(b.dataset.volver||b.id==='nueva')cerrarCobro()
  else if(b.id==='ok')confirmarCobro()
  else if(b.dataset.c!==undefined){cat=+b.dataset.c;chips();grid()}
  else if(b.classList.contains('p')){const id=b.dataset.id;cart[id]=(cart[id]||0)+1;ticket()}
  else if(b.dataset.m){const id=b.dataset.id;cart[id]+=b.dataset.m==='+'?1:-1;if(cart[id]<1)delete cart[id];ticket()}
  else if(b.id==='pay')abrirCobro();
  else if(b.id==='hold')guardarPend();
  else if(b.id==='cancel')cancelarPend();
  else if(b.classList.contains('pe'))abrirPend(b.dataset.id);
});
$('#q').addEventListener('input',e=>{q=norm(e.target.value.trim());grid()});
chips();grid();ticket();
