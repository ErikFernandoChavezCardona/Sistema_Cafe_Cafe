<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Café · Entrar</title>
<link rel="stylesheet" href="../assets/css/cafe.css">
<style>
body{background:var(--azul);display:grid;place-items:center;color:var(--tinta)}
main{width:min(360px,92vw);display:flex;flex-direction:column;align-items:center;gap:12px}
.mark{font-family:var(--t);letter-spacing:.3em;font-size:15px;text-transform:uppercase}
.hero{width:340px;height:auto;overflow:visible}
.hero text{font-family:var(--t);font-size:15px;letter-spacing:.22em;fill:var(--tinta)}
/* Único momento animado: el dibujo se traza una vez al abrir */
.l{fill:none;stroke:var(--tinta);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;animation:draw 900ms var(--ease) 150ms forwards}
@keyframes draw{to{stroke-dashoffset:0}}
form{width:100%;display:flex;flex-direction:column;gap:12px}
.go{background:var(--crema);border-color:var(--crema);color:var(--prof)}
#err{min-height:20px;text-align:center;font-weight:600}
.olvido{font-size:12px;color:var(--tinta);text-decoration:underline;text-underline-offset:3px;padding:4px}
.codigo{font:400 24px/1.3 var(--m);letter-spacing:.08em;text-align:center;padding:14px;border-radius:14px;background:var(--crema);user-select:all}
.nota{font-size:12px;text-align:center;margin:8px 0 12px}
#cod{width:100%;display:flex;flex-direction:column;gap:6px}
#cod[hidden],form[hidden],#f [hidden],.olvido[hidden]{display:none}
.off{font-family:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <p class="mark">• Café Café •</p>
  <svg class="hero" viewBox="0 0 400 270" aria-hidden="true">
    <path id="arc" d="M50 210A150 150 0 0 1 350 210" fill="none"/>
    <text><textPath href="#arc" xlink:href="#arc" startOffset="50%" text-anchor="middle">CAFÉ PARA EL PUEBLO QUE LO COSECHA</textPath></text>
    <g transform="translate(139 120) scale(2)">
      <path class="l" pathLength="1" d="M12 26h32v14a12 12 0 0 1-12 12h-8A12 12 0 0 1 12 40z"/>
      <path class="l" pathLength="1" d="M44 30h4a6 6 0 0 1 0 12h-5"/>
      <path class="l" pathLength="1" d="M22 8c-3 4 3 6 0 10M32 8c-3 4 3 6 0 10"/>
      <path class="l" pathLength="1" d="M6 57h52"/>
    </g>
  </svg>
  <form id="f">
    <input class="in" id="u" placeholder="Usuario o correo" autocomplete="username" maxlength="40" required>
    <input class="in" id="p" type="password" placeholder="Contraseña" autocomplete="current-password" maxlength="100" required>
    <input class="in" id="c" placeholder="Código de recuperación" autocomplete="off" maxlength="30" hidden>
    <button class="pill go" id="b">Entrar</button>
  </form>
  <button class="olvido" id="olvido" type="button">¿Olvidaste tu contraseña? (administrador)</button>
  <div id="cod" hidden>
    <p class="eyebrow" style="text-align:center">Tu código de recuperación</p>
    <p class="codigo" id="cod-v"></p>
    <p class="nota">Anótalo y guárdalo fuera de la computadora. Si olvidas tu contraseña es la única forma de volver a entrar. No se vuelve a mostrar.</p>
    <button class="pill go" id="cod-ok" type="button">Ya lo anoté</button>
  </div>
  <p id="err" role="alert"></p>
  <p class="off">Sin conexión · datos guardados en este equipo</p>
</main>
<script>
// Java entrega window.javaApp y luego llama a onJavaReady. Sin Java (abierto en el navegador) solo navega, para ver el diseño.
let modo='entrar';   // entrar | crear (primer arranque) | recuperar
const $=s=>document.getElementById(s);
window.mostrarError=m=>{$('err').textContent=m};
function poner(m){
  modo=m;$('err').textContent='';
  $('c').hidden=m!=='recuperar';$('c').required=m==='recuperar';
  $('olvido').hidden=m==='crear';
  $('p').autocomplete=m==='entrar'?'current-password':'new-password';
  $('u').placeholder=m==='crear'?'Crea tu usuario administrador':'Usuario o correo';
  $('p').placeholder=m==='crear'?'Crea tu contraseña (mínimo 8, con letras y números)':m==='recuperar'?'Contraseña nueva (mínimo 8, letras y números)':'Contraseña';
  $('b').textContent=m==='crear'?'Crear administrador':m==='recuperar'?'Cambiar contraseña':'Entrar';
  $('olvido').textContent=m==='recuperar'?'Volver a entrar':'¿Olvidaste tu contraseña? (administrador)';
}
window.onJavaReady=()=>{ if(!javaApp.hayUsuarios()) poner('crear'); };
$('olvido').addEventListener('click',()=>poner(modo==='recuperar'?'entrar':'recuperar'));
function mostrarCodigo(c){
  $('f').hidden=true;$('olvido').hidden=true;$('cod').hidden=false;$('cod-v').textContent=c;$('err').textContent='';
}
$('cod-ok').addEventListener('click',()=>javaApp.continuar());
$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const u=$('u').value.trim(), p=$('p').value;
  if(!window.javaApp){ location.href='pos.html'; return; }
  if(modo==='crear'){ const r=JSON.parse(javaApp.crearAdmin(u,p)); if(r.ok) mostrarCodigo(r.codigo); }
  else if(modo==='recuperar'){ const r=JSON.parse(javaApp.recuperar(u,$('c').value,p)); if(r.ok) mostrarCodigo(r.codigo); }
  else javaApp.login(u,p);
});
</script>
</body>
</html>
